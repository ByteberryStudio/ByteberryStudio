<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 254" width="1200" height="254" role="img" aria-label="Tools I build with"><title>Tools I build with</title><style>@font-face{font-family:BBSans;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:BBPixel;src:url(data:font/woff2;base64,) format('woff2');}
.px{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards}
.px.twinkle{animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards,twinkle 5s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,86%,100%{fill:#ffb3cc}92%{fill:#ffffff}}
.bob{animation:bob 6s ease-in-out 2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.drift0{animation:drift0 18s ease-in-out infinite alternate}
.drift1{animation:drift1 22s ease-in-out infinite alternate}
@keyframes drift0{to{transform:translate(60px,30px)}}
@keyframes drift1{to{transform:translate(-70px,-20px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.static{display:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .px,.rise{opacity:1}
  .motion{display:none}
  .static{display:inline}
}
.chip{animation:chip 7.7s ease-in-out infinite}@keyframes chip{0%,22.9%,100%{stroke:#3a2440;fill:#1c1022}11.4%{stroke:#ff5c93;fill:#2a1832}}</style><defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f7eef3" fill-opacity=".09"/></pattern>
<radialGradient id="glowB"><stop offset="0" stop-color="#ff5c93" stop-opacity=".42"/><stop offset="1" stop-color="#ff5c93" stop-opacity="0"/></radialGradient>
<radialGradient id="glowL"><stop offset="0" stop-color="#7bd389" stop-opacity=".2"/><stop offset="1" stop-color="#7bd389" stop-opacity="0"/></radialGradient>

<clipPath id="card"><rect width="1200" height="254" rx="24"/></clipPath>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
  <stop offset="0" stop-color="#ffb3cc" stop-opacity="0"/>
  <stop offset=".44" stop-color="#ffb3cc" stop-opacity=".75"/>
  <stop offset=".56" stop-color="#7bd389" stop-opacity=".6"/>
  <stop offset="1" stop-color="#7bd389" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="7s" repeatCount="indefinite"/>
</linearGradient></defs>
