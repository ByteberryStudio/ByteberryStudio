  <stop offset="1" stop-color="#7bd389" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="7s" repeatCount="indefinite"/>
</linearGradient></defs>
