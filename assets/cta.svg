<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Got a project in mind? Get in touch"><title>Got a project in mind? Get in touch</title><style>@font-face{font-family:BBDisplay;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:BBSans;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:BBSansBold;src:url(data:font/woff2;base64,) format('woff2');}
.px{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards}
.px.twinkle{animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards,twinkle 5s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,86%,100%{fill:#ffb3cc}92%{fill:#ffffff}}
.bob{animation:bob 6s ease-in-out 2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.drift0{animation:drift0 18s ease-in-out infinite alternate}
.drift1{animation:drift1 22s ease-in-out infinite alternate}
@keyframes drift0{to{transform:translate(60px,30px)}}
@keyframes drift1{to{transform:translate(-70px,-20px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.static{display:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .px,.rise{opacity:1}
  .motion{display:none}
  .static{display:inline}
}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.25,1.6);opacity:0}}.nudge{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translateX(5px)}}</style><defs>
