<radialGradient id="glowL"><stop offset="0" stop-color="#7bd389" stop-opacity=".2"/><stop offset="1" stop-color="#7bd389" stop-opacity="0"/></radialGradient>

<clipPath id="card"><rect width="1200" height="230" rx="28"/></clipPath>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
