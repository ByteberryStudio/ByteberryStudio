name: Contribution snake

on:
  schedule:
    - cron: "0 14 * * *" # daily, around midnight in Melbourne
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake in Byteberry colours
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7bd389&color_dots=#1c1022,#4a1d38,#86234f,#d23f75,#ff5c93
            dist/snake-light.svg?color_snake=#2f9e44&color_dots=#f6eef2,#ffc9da,#ff8fb3,#ff5c93,#c2185b

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
